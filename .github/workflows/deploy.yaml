name: Teste no DInf

on:
  push:
    branches:
      - main
      - 'p[0-9]+'       # dispara em p1, p2, p3, ..., p14
      - generic-queue   # dispara na branch da fila genérica

jobs:
  deploy-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar chave SSH e known_hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ vars.SSH_PORT }} -H ${{ vars.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Sincronizar arquivos (Rsync)
        run: |
          for i in 1 2 3 4 5; do
            echo "Tentativa $i..."
            rsync -avz --delete --exclude='.git/' -e "ssh -p ${{ vars.SSH_PORT }}" \
              ./ppos-aluno/ ${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}:/home/bcc/fns21/ppos-aluno/ && break
            echo "Falhou, aguardando 10s..."
            sleep 10
          done

      - name: Compilar e testar no servidor
        run: |
          BRANCH="${{ github.ref_name }}"

          # Na main, compila e testa todos os projetos p1..p14
          if [[ "$BRANCH" == "main" ]]; then
            PROJECTS="p1 p2 p3 p4 p5 p6 p7 p8 p9 p10 p11 p12 p13 p14"
          elif [[ "$BRANCH" =~ ^p[0-9]+$ ]]; then
            PROJECTS="$BRANCH"
          elif [[ "$BRANCH" == "generic-queue" ]]; then
            PROJECTS="generic-queue"
          else
            echo "Branch '$BRANCH' não é um projeto, pulando."
            exit 0
          fi

          for i in 1 2 3 4 5; do
            echo "Tentativa $i..."
            ssh -p ${{ vars.SSH_PORT }} ${{ vars.SSH_USER }}@${{ vars.SSH_HOST }} \
              "cd /home/bcc/fns21/ppos-aluno && \
              TOTAL_PASS=0 && TOTAL_FAIL=0 && ALL_ERRORS='' && \
              for PROJECT in $PROJECTS; do \
                echo '' && \
                echo '=============================' && \
                echo \"=== Compilando \$PROJECT ===\" && \
                echo '=============================' && \
                if [ \"\$PROJECT\" = 'generic-queue' ]; then \
                  cp lib/queue.c lib/queue.h test/queue/ && \
                  make -C test/queue purge && make -C test/queue queue-test || { echo \"ERRO: falha ao compilar queue-test\"; continue; } && \
                  BIN='queue-test' && \
                  EXPECTED='test/queue/queue-test.txt' && \
                  echo \"=== Testando \$BIN ===\" && \
                  ACTUAL=\$(timeout 30 test/queue/\$BIN 2>&1) || true && \
                  EXPECTED_OUT=\$(cat \"\$EXPECTED\") && \
                  if [ \"\$ACTUAL\" = \"\$EXPECTED_OUT\" ]; then \
                    echo \"PASS \$BIN\" && TOTAL_PASS=\$((TOTAL_PASS + 1)); \
                  else \
                    echo \"FAIL \$BIN\" && \
                    echo '--- saída esperada ---' && echo \"\$EXPECTED_OUT\" | head -50 && \
                    echo '--- saída obtida ---' && echo \"\$ACTUAL\" | head -50 && \
                    TOTAL_FAIL=\$((TOTAL_FAIL + 1)) && ALL_ERRORS=\"\$ALL_ERRORS \$BIN\"; \
                  fi; \
                  continue; \
                fi && \
                make clean && make \$PROJECT || { echo \"ERRO: falha ao compilar \$PROJECT\"; continue; } && \
                case \$PROJECT in \
                  p1)  BINS='pingpong-task1 pingpong-task2 pingpong-task3' ;; \
                  p2)  BINS='pingpong-dispatcher' ;; \
                  p3)  BINS='pingpong-scheduler' ;; \
                  p4)  BINS='pingpong-preempcao' ;; \
                  p5)  BINS='pingpong-contab pingpong-contab-prio pingpong-contab-stress' ;; \
                  p6)  BINS='pingpong-wait pingpong-wait-stress' ;; \
                  p7)  BINS='pingpong-sleep' ;; \
                  p8)  BINS='pingpong-semaphore pingpong-semaphore-stress' ;; \
                  p9)  BINS='pingpong-prodcons' ;; \
                  p10) BINS='pingpong-mqueue' ;; \
                  p11) BINS='pingpong-memoria pingpong-mqueue' ;; \
                  p12) BINS='pingpong-disco pingpong-disco-stress' ;; \
                  p13) BINS='pingpong-disco-stress' ;; \
                  p14) BINS='pingpong-cache-on pingpong-cache-off' ;; \
                  *)   BINS='' ;; \
                esac && \
                for BIN in \$BINS; do \
                  EXPECTED=\"test/\$BIN.txt\" && \
                  if [ ! -f \"\$EXPECTED\" ]; then echo \"SKIP \$BIN (expected não encontrado)\"; continue; fi && \
                  if [ ! -f \"\$BIN\" ]; then echo \"SKIP \$BIN (binário não encontrado)\"; continue; fi && \
                  echo \"=== Testando \$BIN ===\" && \
                  ACTUAL=\$(timeout 30 ./\$BIN 2>&1) || true && \
                  EXPECTED_OUT=\$(cat \"\$EXPECTED\") && \
                  if [ \"\$ACTUAL\" = \"\$EXPECTED_OUT\" ]; then \
                    echo \"PASS \$BIN\" && TOTAL_PASS=\$((TOTAL_PASS + 1)); \
                  else \
                    echo \"FAIL \$BIN\" && \
                    echo '--- saída esperada ---' && echo \"\$EXPECTED_OUT\" | head -50 && \
                    echo '--- saída obtida ---' && echo \"\$ACTUAL\" | head -50 && \
                    TOTAL_FAIL=\$((TOTAL_FAIL + 1)) && ALL_ERRORS=\"\$ALL_ERRORS \$BIN\"; \
                  fi; \
                done; \
              done && \
              echo '' && \
              echo \"Resultado final: \$TOTAL_PASS passou, \$TOTAL_FAIL falhou\" && \
              if [ \$TOTAL_FAIL -gt 0 ]; then echo \"Falhas:\$ALL_ERRORS\" && exit 1; fi" && break
            echo "Falhou, aguardando 10s..."
            sleep 10
          done
