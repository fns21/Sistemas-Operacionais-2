name: Teste no DInf

on:
  push:
    branches:
      - main
      - 'p[0-9]+'   # dispara em p1, p2, p3, ..., p14

jobs:
  deploy-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar chave SSH e known_hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ vars.SSH_PORT }} -H ${{ vars.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Sincronizar arquivos (Rsync)
        run: |
          rsync -avz --delete --exclude='.git/' -e "ssh -p ${{ vars.SSH_PORT }}" \
            ./ppos-aluno/ ${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}:/home/bcc/fns21/ppos-aluno/

      - name: Compilar no servidor
        continue-on-error: false
        run: |
          BRANCH="${{ github.ref_name }}"

          if [[ "$BRANCH" =~ ^p[0-9]+$ ]]; then
            ssh -p ${{ vars.SSH_PORT }} ${{ vars.SSH_USER }}@${{ vars.SSH_HOST }} \
              "cd /home/bcc/fns21/ppos-aluno && make clean && make debug $BRANCH"
          else
            echo "Branch '$BRANCH' não é um projeto, pulando compilação."
          fi

      - name: Executar testes no servidor
        continue-on-error: false
        run: |
          BRANCH="${{ github.ref_name }}"

          if [[ "$BRANCH" =~ ^p[0-9]+$ ]]; then
            ssh -p ${{ vars.SSH_PORT }} ${{ vars.SSH_USER }}@${{ vars.SSH_HOST }} bash << EOF
              set -e
              cd /home/bcc/fns21/ppos-aluno
              PASS=0
              FAIL=0
              ERRORS=""

              for EXPECTED in test/$BRANCH/pingpong-*.txt; do
                # nome do binário = nome do arquivo sem .txt
                BIN=\$(basename "\$EXPECTED" .txt)

                if [ ! -f "\$BIN" ]; then
                  echo "SKIP \$BIN (binário não encontrado)"
                  continue
                fi

                echo "=== Testando \$BIN ==="
                ACTUAL=\$(timeout 30 ./\$BIN 2>&1) || true
                EXPECTED_OUT=\$(cat "\$EXPECTED")

                if [ "\$ACTUAL" = "\$EXPECTED_OUT" ]; then
                  echo "PASS \$BIN"
                  PASS=\$((PASS + 1))
                else
                  echo "FAIL \$BIN"
                  echo "--- saída esperada ---"
                  echo "\$EXPECTED_OUT" | head -20
                  echo "--- saída obtida ---"
                  echo "\$ACTUAL" | head -20
                  FAIL=\$((FAIL + 1))
                  ERRORS="\$ERRORS \$BIN"
                fi
              done

              echo ""
              echo "Resultado: \$PASS passou(aram), \$FAIL falhou(aram)"

              if [ \$FAIL -gt 0 ]; then
                echo "Testes com falha:\$ERRORS"
                exit 1
              fi
EOF
          else
            echo "Branch '$BRANCH' não é um projeto, pulando testes."
          fi
